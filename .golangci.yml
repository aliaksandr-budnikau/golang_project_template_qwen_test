# golangci-lint configuration (v2).
# Docs: https://golangci-lint.run/usage/configuration/
#
# The default build is HTTP-only and dependency-free; the gRPC layer is opt-in
# (build with `-tags grpc`, generated by `make proto`). Linting the default
# build never requires the generated code.
#
# v1 -> v2 notes: `version` is now required; `gofmt` is a formatter (not a
# linter); `linters-settings` moved to `linters.settings`; and gosec's
# per-rule `exclude-rules` is gone, so the G104-in-tests rule lives under
# `issues.exclude-rules` instead. The v1 file is kept at .golangci.yml.v1.bak.

version: "2"

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck      # ensure returned errors are checked
    - gosec         # security checks
    - govet         # go vet
    - ineffassign   # ineffective assignments
    - misspell      # common misspellings
    - revive        # style / naming
    - staticcheck   # static analysis
    - unused        # unused code
  settings:
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: increment-decrement
        - name: range
        - name: var-naming
        - name: var-declaration

formatters:
  enable:
    - gofmt

issues:
  # G104 ("errors should be checked") overlaps with errcheck, so we only silence
  # it in test files, where errcheck already guards the code path.
  exclude-rules:
    - linters:
        - gosec
      path: _test\.go
