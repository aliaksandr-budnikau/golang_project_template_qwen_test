syntax = "proto3";

package empty_project.v1;

// The generated Go package name is "v1", imported as `pb "github.com/yourname/empty_project/api/proto/v1"`.
option go_package = "github.com/yourname/empty_project/api/proto/v1;v1";

// Ping is a sample gRPC service demonstrating the contract-to-code path.
service Ping {
  // Ping returns a greeting for the given message.
  rpc Ping(PingRequest) returns (PingResponse);
}

message PingRequest {
  string message = 1;
}

message PingResponse {
  string message = 1;
}
